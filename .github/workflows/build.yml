name: Test, Build and Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.compare.outputs.should_release }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from header
        id: version
        run: |
          VERSION=$(grep '#define APIC_VERSION' inc/utils/version.hpp | cut -d '"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest release version
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v0.0.0")
          LATEST=${LATEST#v}

          CURRENT="${{ steps.version.outputs.version }}"

          echo "Latest release: $LATEST"
          echo "Current version: $CURRENT"

          if [ "$(printf '%s\n' "$LATEST" "$CURRENT" | sort -V | tail -n1)" = "$CURRENT" ] \
             && [ "$LATEST" != "$CURRENT" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'

    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            ext: ""
            name: "linux-x64"
          - os: windows-2022
            ext: ".exe"
            name: "windows-x64"
          - os: macos-15
            ext: ""
            name: "macos-x64"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CORRECTION 1 : On utilise la condition GitHub native (runner.os)
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y make g++

      # Sous Windows-2022, MSYS2 et make sont déjà pré-installés. 
      # Si votre makefile nécessite l'environnement MSYS2, on force le shell bash.
      - name: Build project
        shell: bash
        run: make build EXT="${{ matrix.ext }}"

      # CORRECTION 2 : On utilise le shell bash explicitement pour tout le monde,
      # et on teste runner.os (Windows / Linux / macOS) au lieu du nom de l'image.
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp apic.exe dist/apic-${{ matrix.name }}.exe
          else
            cp apic dist/apic-${{ matrix.name }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }} # Plus propre d'utiliser le nom de l'architecture ici
          path: dist/*

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.check-version.outputs.version }}"
          FILES=$(find artifacts -type f)

          echo "Creating release $VERSION"
          echo "Files:"
          echo "$FILES"

          gh release create "$VERSION" $FILES \
            --title "$VERSION" \
            --notes "Release automatique"